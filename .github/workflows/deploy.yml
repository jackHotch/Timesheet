name: Deploy

on:
  push:
    branches: [production]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/timesheet
            git pull origin production

            cd api
            npm ci
            npm run migrate:up
            npm run build
            cd ..

            cd client
            npm ci
            npm run build
            cd ..

            pm2 reload timesheet
