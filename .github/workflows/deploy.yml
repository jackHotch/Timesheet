name: Deploy

on:
  push:
    branches: [production]

permissions:
  id-token: write
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        working-directory: api
        run: npm ci
      - name: Run migrations against Neon
        working-directory: api
        env:
          DATABASE_HOST: ${{ secrets.NEON_DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.NEON_DATABASE_PORT }}
          DATABASE_USER: ${{ secrets.NEON_DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.NEON_DATABASE_PASSWORD }}
          DATABASE_NAME: ${{ secrets.NEON_DATABASE_NAME }}
          DATABASE_SSL: 'true'
        run: npm run migrate:up

  build-push-api:
    needs: migrate
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPO_API }}:${{ github.sha }}
      - id: image
        run: echo "image=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPO_API }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  build-push-client:
    needs: migrate
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: client
          file: client/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPO_CLIENT }}:${{ github.sha }}
      - id: image
        run: echo "image=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPO_CLIENT }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy-api:
    needs: build-push-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Fill in AWS account ID
        run: sed -i "s/__AWS_ACCOUNT_ID__/${{ secrets.AWS_ACCOUNT_ID }}/g" deploy/ecs/api-taskdef.json
      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy/ecs/api-taskdef.json
          container-name: timesheet-api
          image: ${{ needs.build-push-api.outputs.image }}
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE_API }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-client:
    needs: build-push-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Fill in AWS account ID
        run: sed -i "s/__AWS_ACCOUNT_ID__/${{ secrets.AWS_ACCOUNT_ID }}/g" deploy/ecs/client-taskdef.json
      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy/ecs/client-taskdef.json
          container-name: timesheet-client
          image: ${{ needs.build-push-client.outputs.image }}
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE_CLIENT }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
